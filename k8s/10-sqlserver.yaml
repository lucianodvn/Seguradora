apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-dados
  namespace: seguradora
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: seguradora
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: SQL_SA_PASSWORD
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: dados
              mountPath: /var/opt/mssql
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: sqlserver-dados
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: seguradora
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433