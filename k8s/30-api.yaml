apiVersion: apps/v1
kind: Deployment
metadata:
  name: seguradora-api
  namespace: seguradora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seguradora-api
  template:
    metadata:
      labels:
        app: seguradora-api
    spec:
      initContainers:
        - name: aguardar-sqlserver
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z sqlserver 1433; do echo aguardando sqlserver; sleep 3; done"]
      containers:
        - name: api
          image: seguradora-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: SQL_SA_PASSWORD
            - name: ConnectionStrings__Default
              value: "Server=sqlserver,1433;Database=Seguradora;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True"
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: RABBITMQ_PASSWORD
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: JWT_KEY
            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: JWT_AUDIENCE
            - name: Auth__Usuario
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: AUTH_USUARIO
            - name: Auth__Senha
              valueFrom:
                secretKeyRef:
                  name: seguradora-segredos
                  key: AUTH_SENHA
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: seguradora-api
  namespace: seguradora
spec:
  selector:
    app: seguradora-api
  ports:
    - port: 8080
      targetPort: 8080